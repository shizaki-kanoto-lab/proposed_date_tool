labels: []
body:
  - type: markdown
    attributes:
      value: |
        空き日程抽出ツールについての質問はこちらへどうぞ。
  - type: textarea
    id: question
    attributes:
      label: 質問内容
      description: 何について知りたいですか？
      placeholder: 例）Googleカレンダーとの連携はできますか？
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 試したこと・状況（任意）
      description: すでに試したことや、今の状況があれば教えてください
    validations:
      required: false
